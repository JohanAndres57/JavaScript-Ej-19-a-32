<script>
    function validarEdad(edad) {
  if (edad < 0) {
    throw new Error("La edad no puede ser un número negativo.");
  }
  return `Edad válida: ${edad} años.`;
}

// Ejemplo de uso con try/catch:
try {
  console.log(validarEdad(25));  // "Edad válida: 25 años."
  console.log(validarEdad(-5));  // Lanza el error
} catch (error) {
  console.error("Error de validación:", error.message);
}
</script>
